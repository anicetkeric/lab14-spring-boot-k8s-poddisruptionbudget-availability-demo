apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdb-demo
  labels:
    app: pdb-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pdb-demo
  template:
    metadata:
      labels:
        app: pdb-demo
    spec:
      # Soft anti-affinity: the scheduler prefers one pod per node, so a
      # 3-replica/3-node cluster spreads one-to-one — but it's still allowed
      # to double up if a node is cordoned, which is exactly what we want
      # when a drained pod needs to reschedule elsewhere.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: pdb-demo
                topologyKey: kubernetes.io/hostname
      containers:
        - name: pdb-demo
          image: pdb-demo:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pdb-demo-service
spec:
  type: ClusterIP
  selector:
    app: pdb-demo
  ports:
    - port: 80
      targetPort: 8080
