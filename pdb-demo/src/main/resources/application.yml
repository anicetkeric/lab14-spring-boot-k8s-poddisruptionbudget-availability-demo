server:
  port: 8080

spring:
  application:
    name: pdb-demo

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,chaos
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
